name: Sync upstream trunk

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

concurrency:
  group: sync-upstream-trunk
  cancel-in-progress: false

jobs:
  sync-upstream-trunk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream trunk
        run: |
          git remote add upstream https://github.com/Automattic/studio.git
          git fetch upstream trunk --prune

      - name: Update upstream-trunk mirror branch
        run: |
          git checkout -B upstream-trunk upstream/trunk
          git push origin upstream-trunk --force-with-lease
