# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

env:
  IMAGE_ID: $IMAGE_ID

steps:
  - label: ":snowflake: Code Freeze"
    plugins: [$CI_TOOLKIT_PLUGIN, $NVM_PLUGIN]
    command: |
      echo "--- :robot_face: Set up Git identity"
      git config user.name "Studio Release Bot"
      git config user.email "studio-bot@masonjames.com"

      echo "--- :npm: Install Node dependencies"
      .buildkite/commands/install-node-dependencies.sh

      echo "--- :ruby: Setup Ruby Tools"
      install_gems

      echo "--- :snowflake: Execute Code Freeze"
      bundle exec fastlane code_freeze version:"${RELEASE_VERSION}" github_username:"${GITHUB_USERNAME}" skip_confirm:true
    artifact_paths:
      - i18n/bundle-strings.pot
    agents:
      queue: mac
    retry:
      manual:
        reason: Re-trigger this release action from the Release Dispatch workflow or the studio-release-dispatch Buildkite pipeline instead of retrying the individual job
        allowed: false
